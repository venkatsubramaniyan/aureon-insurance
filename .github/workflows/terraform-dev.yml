name: Aureon Terraform Dev - OIDC, Validate & Plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aureon-terraform-dev-state
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Plan Dev Batch 3
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    runs-on:
      - self-hosted
      - Linux
      - X64
      - aureon-terraform-dev

    environment: dev

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity and subscription
        run: |
          az account show \
            --query "{subscription:name, subscriptionId:id, tenantId:tenantId}" \
            --output json

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/terraform/environments/dev
        run: terraform init -input=false -no-color -lockfile=readonly

      - name: Terraform Validate
        working-directory: infra/terraform/environments/dev
        run: terraform validate -no-color -var-file=batch3.workflow.tfvars

      - name: Terraform Plan
        working-directory: infra/terraform/environments/dev
        shell: bash
        run: |
          command -v python3 >/dev/null || { echo "python3 is required on the Dev runner"; exit 1; }
          umask 077
          plan_dir="$(mktemp -d "$RUNNER_TEMP/aureon-batch3-plan.XXXXXX")"
          trap 'rm -f -- "$plan_dir/batch3.tfplan"; rmdir -- "$plan_dir"' EXIT
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var-file=batch3.workflow.tfvars -out="$plan_dir/batch3.tfplan"
          terraform show -json "$plan_dir/batch3.tfplan" \
            | python3 "$GITHUB_WORKSPACE/.github/scripts/check-batch3-plan.py"
          printf 'Review this Batch 3 plan for commit `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"